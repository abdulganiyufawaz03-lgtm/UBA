<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UBA Logo Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@1,900&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="logo-wrapper">
    <div class="uba-mark">
      
      <!-- Slanted Bold Typography -->
      <span class="letter letter-u">U</span>
      <span class="letter letter-b">B</span>
      <span class="letter letter-a">A</span>
      
      <div class="flame-container">
        <div class="wing wing-left"></div>
        <div class="wing wing-right"></div>
      </div>

    </div>

    <div class="uba-subtitle">
      United Bank for Africa
    </div>
  </div>

</body>
</html>
